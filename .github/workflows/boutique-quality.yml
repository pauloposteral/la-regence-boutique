name: Boutique quality
on:
  push:
    branches: [main, fix/bam-181-brl-auth-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: boutique-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply branch-only reviewed migration
        if: github.ref == 'refs/heads/fix/bam-181-brl-auth-ux'
        run: node scripts/bam181-apply.mjs
      - name: Unit and regression tests
        run: npm test
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: npm run build
      - name: Save verified source patch on isolated branch
        if: github.ref == 'refs/heads/fix/bam-181-brl-auth-ux'
        run: |
          git add src
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(BAM-181): normalize BRL, harden auth and improve storefront readability'
            git push origin HEAD:fix/bam-181-brl-auth-ux
          fi
