name: Boutique quality
on:
  push:
    branches: [main, fix/bam-181-brl-auth-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: boutique-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize npm lock for managed Google dependency
        if: github.ref == 'refs/heads/fix/bam-181-brl-auth-ux'
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and independent regression tests
        run: npm test
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: npm run build
      - name: Save verified lock and read-only permanent workflow
        if: github.ref == 'refs/heads/fix/bam-181-brl-auth-ux'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/boutique-quality.yml')
          s=p.read_text().replace('    permissions:\n      contents: write\n','')
          start=s.index('      - name: Synchronize npm lock')
          end=s.index('      - name: Install locked dependencies',start)
          s=s[:start]+s[end:]
          s=s[:s.index('      - name: Save verified lock')]
          p.write_text(s)
          PY
          git add package-lock.json .github/workflows/boutique-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(BAM-181): synchronize npm lock and retain read-only quality gates'
          git push origin HEAD:fix/bam-181-brl-auth-ux
