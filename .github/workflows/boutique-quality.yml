name: Boutique quality
on:
  push:
    branches: [main, fix/bam-181-brl-auth-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: boutique-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and independent regression tests
        run: npm test
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: npm run build
